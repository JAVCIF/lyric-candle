<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Lyric Candle: Sonic Candle's badge (black ring, gradient disc), with a candle flame
       repainting a line of lyrics. Kept to SVG Tiny features so Qt renders it as designed. -->
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="0.55" stop-color="#173a63"/>
      <stop offset="1" stop-color="#2a6aa6"/>
    </linearGradient>
    <linearGradient id="painted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e09a2c"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.6" stop-color="#ffc23d"/>
      <stop offset="1" stop-color="#ffe9a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Soft shadow (offset rings instead of filters). -->
  <circle cx="208" cy="210" r="184" fill="#000" fill-opacity="0.10"/>
  <circle cx="206" cy="207" r="182" fill="#000" fill-opacity="0.14"/>
  <!-- Badge -->
  <circle cx="200" cy="200" r="180" fill="#000"/>
  <circle cx="200" cy="200" r="150" fill="url(#disc)"/>
  <g transform="translate(0,20)">
  <!-- Warm light around the flame -->
  <circle cx="200" cy="150" r="92" fill="url(#glow)"/>
  <!-- Primary lyric line: repainted (gold) up to the flame, still white after it. -->
  <path d="M 98 190 L 200 190 L 200 220 L 98 220 A 15 15 0 0 1 98 190 Z" fill="url(#painted)"/>
  <path d="M 200 190 L 302 190 A 15 15 0 0 1 302 220 L 200 220 Z" fill="#e8f0fb" fill-opacity="0.92"/>
  <!-- Secondary line (translation) -->
  <path d="M 136 244 L 264 244 A 10 10 0 0 1 264 264 L 136 264 A 10 10 0 0 1 136 244 Z" fill="#8fb8e6" fill-opacity="0.75"/>
  <!-- Flame: the karaoke wipe head. -->
  <path d="M 200 78 C 214 104 236 124 236 152 C 236 173 220 186 200 186 C 180 186 164 173 164 152 C 164 128 184 112 200 78 Z" fill="url(#flame)"/>
  <path d="M 200 128 C 207 141 217 150 217 162 C 217 173 209 180 200 180 C 191 180 183 173 183 162 C 183 151 193 143 200 128 Z" fill="#fff6d6"/>
  <!-- Wick -->
  <rect x="197" y="178" width="6" height="12" rx="2" fill="#2a1a0b"/>
  </g>
</svg>
