name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff (same version as pyproject's dev extra)
        run: python -m pip install "ruff==0.16.9"
      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}${{ matrix.qt && format(' · {0}', matrix.qt) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.12', qt: '' }
          - { os: windows-latest, python: '3.12', qt: '' }
          # Newest Python with the newest PySide6 the range allows (3.14 needs 6.10).
          - { os: ubuntu-24.04, python: '3.14', qt: '' }
          # Oldest supported pair: the lower bounds of requires-python and PySide6.
          - { os: ubuntu-24.04, python: '3.10', qt: 'PySide6==6.8.3' }
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
      LYRIC_CANDLE_LANG: es
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg and Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libegl1 libgl1 libxkbcommon-x11-0
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Pin the oldest supported PySide6
        if: matrix.qt != ''
        run: python -m pip install "${{ matrix.qt }}"
      - name: Show Qt version
        run: python -c "import PySide6, sys; print(sys.version.split()[0], 'PySide6', PySide6.__version__)"
      - name: Check media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Run complete suite
        run: python -m unittest discover -s tests -v
