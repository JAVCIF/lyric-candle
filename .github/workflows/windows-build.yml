name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Portable Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Build portable folder and ZIP
        run: python scripts/build_windows.py --portable --zip
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v6
        with:
          name: Lyric-Candle-Windows-x64
          path: |
            dist/Lyric-Candle-*-Windows-x64.zip
            dist/Lyric-Candle-*-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
